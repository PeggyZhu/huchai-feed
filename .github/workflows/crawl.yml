name: refresh

# Monday 02:00 UTC is Monday 10:00 in Shanghai. The scheduled run always
# tries the public endpoint and stops if it is still an anti-bot page.
# workflow_dispatch can instead record a total the maintainer read in a
# normal browser. Empty inputs fall through to the same crawl.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      deals:
        description: "成交套数（整数）。留空则改为在线抓取。"
        required: false
        type: string
      trade_date:
        description: "成交日 YYYY-MM-DD。填写套数时必填，填昨天而不是今天。"
        required: false
        type: string
      area:
        description: "成交面积（平方米），可留空。"
        required: false
        type: string
      json:
        description: '一行 JSON，与套数二选一。例如 {"deals":697,"date":"2026-11-13"}'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: huchai-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Import a supplied total, or crawl when none was supplied
        env:
          DEALS: ${{ github.event_name == 'workflow_dispatch' && inputs.deals || '' }}
          TRADE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.trade_date || '' }}
          AREA: ${{ github.event_name == 'workflow_dispatch' && inputs.area || '' }}
          IMPORT_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.json || '' }}
        run: |
          python3 - << 'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          from huchai.ingest import refresh_command

          try:
              command = refresh_command(
                  os.environ.get("DEALS", ""),
                  os.environ.get("TRADE_DATE", ""),
                  os.environ.get("AREA", ""),
                  os.environ.get("IMPORT_JSON", ""),
                  json_path=Path("/tmp/huchai-import.json"),
              )
          except ValueError as exc:
              print(exc, file=sys.stderr)
              sys.exit(1)
          sys.exit(subprocess.call(command))
          PY
      - name: Commit when the snapshot changed
        run: |
          set -euo pipefail
          if git diff --quiet -- fangdi.json snapshots && [ -z "$(git ls-files --others --exclude-standard -- fangdi.json snapshots)" ]; then
            echo "No data change. Leaving the repository as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- fangdi.json snapshots
          git commit -m "Update fangdi net-sign snapshot"
          git push
