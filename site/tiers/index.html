<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="沪拆信号小区页：公开公告和贝壳成交套数。不是投资建议。">
  <title>沪拆信号 · 小区</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%239f2d2d'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #1c1917;
      --muted: #5c564e;
      --paper: #efeae1;
      --card: #fffdf8;
      --line: #e3d9cc;
      --red: #9f2d2d;
      --info: #3f4f66;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    a { color: var(--red); }
    a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    .skip { position: absolute; left: 12px; top: -40px; background: #fff; padding: 8px 12px; }
    .skip:focus { top: 8px; }
    header.banner {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 28px 20px 22px;
      background: #241c18;
      color: #f6f1e8;
    }
    .kicker { margin: 0; color: #d9c7b4; font-size: 13px; letter-spacing: 0.08em; }
    h1 {
      margin: 2px 0 0;
      font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.1;
    }
    .stamp {
      margin: 0;
      border: 1.5px solid #e7b4a8;
      color: #f0c7bc;
      padding: 8px 6px;
      font-size: 13px;
      letter-spacing: 0.2em;
      writing-mode: vertical-rl;
    }
    main { max-width: 880px; margin: 0 auto; padding: 8px 20px 40px; }
    .banner-note, .conclusion, .card, .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .banner-note, .conclusion { padding: 14px 16px; margin: 16px 0; }
    .banner-note { border-left: 4px solid var(--red); }
    .conclusion p { margin: 0 0 10px; }
    .conclusion p:last-child { margin-bottom: 0; }
    h2 { font-size: 15px; letter-spacing: 0.14em; margin: 28px 0 12px; }
    .jumps { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
    .jumps a {
      text-decoration: none;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 14px;
      white-space: nowrap;
    }
    .card { padding: 16px; margin: 0 0 14px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .card h3 { margin: 0; font-size: 22px; letter-spacing: 0.04em; }
    .district { margin: 2px 0 0; color: var(--muted); }
    .tier {
      margin: 0;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
    }
    .tier-none { background: #f3efe8; color: #5c564e; }
    .tier-high { background: var(--red); color: #fff; }
    .tier-mid { background: #8a5a12; color: #fff; }
    .tier-low { background: var(--info); color: #fff; }
    .meta, .reason, .note, .legend, footer { color: var(--muted); }
    .reason { margin: 10px 0; color: var(--ink); }
    .warn {
      margin: 8px 0;
      padding: 8px 10px;
      background: #f7efe4;
      border-left: 3px solid #8a5a12;
    }
    dl { display: grid; grid-template-columns: 4.5em 1fr; gap: 4px 8px; margin: 8px 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .evidence { margin: 8px 0; }
    .evidence p { margin: 0 0 6px; }
    svg.spark { display: block; width: 100%; height: 48px; }
    .legend { font-size: 13px; margin: 4px 0 0; }
    .now { margin: 10px 0 0; }
    details.panel { padding: 12px 16px; }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-weight: 650; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      background: #f6f1e8;
      border-radius: 8px;
      padding: 2px 6px;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    footer { max-width: 880px; margin: 0 auto; padding: 0 20px 40px; font-size: 14px; }
    footer p { margin: 0 0 8px; }
    .loading { color: var(--muted); }
    @media (max-width: 640px) {
      h1 { font-size: 30px; letter-spacing: 0.08em; }
      main, header.banner, footer { padding-left: 16px; padding-right: 16px; }
      dl { grid-template-columns: 4.2em 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#list">跳到小区</a>
  <header class="banner">
    <p class="stamp">小区</p>
    <div>
      <p class="kicker"><a href="../index.html" style="color:#f0c7bc">沪拆信号</a> · 套数</p>
      <h1>小区信号</h1>
    </div>
  </header>
  <main>
    <p class="banner-note" id="disclaimer">正在读取套数…</p>
    <section id="conclusion"></section>
    <section id="rules"></section>
    <nav class="jumps" id="jumps" aria-label="小区"></nav>
    <section id="list"></section>
  </main>
  <footer id="foot"></footer>
  <noscript><p class="banner-note">需要 JavaScript 才能排版。原始数字在同目录的 <a href="data.json">data.json</a>。</p></noscript>
  <script>
    const COLORS = {
      "公告前": "#9f2d2d",
      "公告当月": "#c47b4a",
      "公告后": "#a39890",
      "未完月": "#e4d5c3",
      "已采集": "#9f2d2d"
    };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function safeUrl(url) {
      if (typeof url !== "string" || !url.startsWith("https://") || /\s/.test(url)) return "";
      return url;
    }

    function countText(block) {
      if (!block) return "—";
      if (block.状态 !== "可算") return block.状态;
      return String(block.套数);
    }

    function resultText(row) {
      if (row.中档) return "过 8%";
      if (row.低档) return "过 5%，未到 8%";
      if (row.单腿) return row.标签 + "；" + row.单腿;
      return row.标签;
    }

    function spark(months) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const max = Math.max(1, ...months.map((item) => item.套数));
      svg.setAttribute("class", "spark");
      svg.setAttribute("viewBox", "0 0 " + (months.length * 8) + " 36");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", months.map((item) => item.月 + " " + item.套数 + "套").join("，"));
      months.forEach((item, index) => {
        const height = item.套数 === 0 ? 1 : Math.max(2, Math.round((item.套数 / max) * 32));
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", String(index * 8 + 1));
        rect.setAttribute("y", String(34 - height));
        rect.setAttribute("width", "6");
        rect.setAttribute("height", String(height));
        rect.setAttribute("rx", "1");
        rect.setAttribute("fill", COLORS[item.位置] || "#9f2d2d");
        svg.append(rect);
      });
      return svg;
    }

    function addLink(parent, url, label) {
      const href = safeUrl(url);
      if (!href) {
        parent.append(el("span", null, label));
        return;
      }
      const link = el("a", null, label);
      link.href = href;
      link.rel = "noreferrer";
      parent.append(link);
    }

    function metricTable(months) {
      const wrap = el("div", "scroll");
      const table = el("table");
      const head = el("tr");
      ["止于", "套数", "前3个月", "上年同期", "较低增速", "结果"].forEach((name) => head.append(el("th", null, name)));
      table.append(head);
      months.forEach((row) => {
        const tr = el("tr");
        [row.止于, countText(row), countText(row.前3个月), countText(row.上年同期), row.较低增速 || "—", resultText(row)]
          .forEach((value) => tr.append(el("td", null, value)));
        table.append(tr);
      });
      wrap.append(table);
      return wrap;
    }

    function renderCard(row) {
      const card = el("article", "card");
      card.id = row.小区;
      const head = el("div", "card-head");
      const titles = el("div");
      titles.append(el("h3", null, row.小区));
      titles.append(el("p", "district", row.区 || ""));
      head.append(titles);
      const tierName = row.档位 || "未分档";
      const tierClass = { "高": "tier-high", "中": "tier-mid", "低": "tier-low" }[tierName] || "tier-none";
      head.append(el("p", "tier " + tierClass, tierName));
      card.append(head);
      card.append(el("p", "reason", row.档位说明 || ""));

      const facts = el("dl");
      const program = row.程序 == null ? "未计" : String(row.程序);
      [["程序", program], ["结构", "未计"], ["硬过滤", row.硬过滤 || "—"], ["匹配", row.匹配 || "—"]].forEach((pair) => {
        facts.append(el("dt", null, pair[0]), el("dd", null, pair[1]));
      });
      card.append(facts);

      const evidence = el("div", "evidence");
      (row.证据 || []).forEach((item) => {
        const line = el("p");
        const bits = [item.公告类型, item.匹配, item.来源日期].filter(Boolean).join(" · ");
        line.append(el("span", null, bits + " "));
        if (item.项目名) line.append(el("span", null, item.项目名 + " "));
        if (item.文号) line.append(el("span", null, item.文号 + " "));
        addLink(line, item.来源URL, "公告原文");
        evidence.append(line);
      });
      card.append(evidence);

      if (row.口径备注) card.append(el("p", "warn", row.口径备注));

      if (row.月度 && row.月度.length) {
        card.append(spark(row.月度));
        card.append(el("p", "legend", "红柱是公告前，橙柱是公告当月，灰柱是公告后，浅柱是未完月。柱高是该月套数。"));
      }

      const now = el("p", "now");
      if (row.当前) {
        const span = row.当前.月份[0] + " 至 " + row.当前.月份[2];
        now.append(el("strong", null, "当前（至 " + row.当前.止于 + "） "));
        now.append(el("span", null, span + " 共 " + row.当前.套数 + " 套。前 3 个月 " + countText(row.当前.前3个月) + " 套，上年同期 " + countText(row.当前.上年同期) + " 套。" + row.当前.标签 + "，量价分 " + row.当前.量价分 + "。"));
      } else {
        now.append(el("strong", null, row.成交状态 + "。 "));
        now.append(el("span", null, row.采集说明 || ""));
      }
      card.append(now);

      if (row.回看) {
        card.append(el("p", "now", "公告前回看：" + row.回看.说明));
        const back = el("details");
        back.append(el("summary", null, "公告前逐月"));
        back.append(metricTable(row.回看.月份));
        card.append(back);
      }

      if (row.月度 && row.月度.length) {
        const months = el("details");
        months.append(el("summary", null, "月度套数"));
        const chips = el("div", "chips");
        row.月度.forEach((item) => chips.append(el("span", "chip", item.月.slice(2) + " " + item.套数)));
        months.append(chips);
        if (row.窗口外 && row.窗口外.length) {
          const outside = row.窗口外.map((item) => item.月 + " " + item.套数 + "套").join("、");
          months.append(el("p", "note", "窗口外：" + outside + "。相邻月份未覆盖，不记为 0。"));
        }
        months.append(el("p", "note", row.采集说明 + "采集 " + row.采集条数 + " 条。"));
        card.append(months);
      }
      return card;
    }

    function render(data) {
      document.title = data.标题 || "沪拆信号 · 小区";
      const disclaimer = document.getElementById("disclaimer");
      disclaimer.textContent = "";
      disclaimer.append(el("strong", null, "更新于 " + data.更新日 + "。 "));
      disclaimer.append(el("span", null, data.免责声明 || ""));

      const conclusion = document.getElementById("conclusion");
      conclusion.className = "conclusion";
      conclusion.append(el("h2", null, "结论"));
      (data.结论 || []).forEach((text) => conclusion.append(el("p", null, text)));

      const rules = document.getElementById("rules");
      const box = el("details", "panel");
      box.append(el("summary", null, "套数规则"));
      const list = el("ul");
      (data.规则 || []).forEach((text) => list.append(el("li", null, text)));
      box.append(list);
      rules.append(box);

      const jumps = document.getElementById("jumps");
      const listRoot = document.getElementById("list");
      (data.小区 || []).forEach((row) => {
        const link = el("a", null, row.小区);
        link.href = "#" + row.小区;
        jumps.append(link);
        listRoot.append(renderCard(row));
      });

      const foot = document.getElementById("foot");
      foot.append(el("p", null, data.生成说明 || ""));
      (data.来源 || []).forEach((item) => foot.append(el("p", null, item.名称 + "：" + item.说明)));
      const home = el("p");
      home.append(el("span", null, "网签快照在 "));
      const back = el("a", null, "首页");
      back.href = "../index.html";
      home.append(back);
      home.append(el("span", null, "。原始数字："));
      const raw = el("a", null, "data.json");
      raw.href = "data.json";
      home.append(raw);
      home.append(el("span", null, "。"));
      foot.append(home);
      if (data.已排除 && data.已排除.length) {
        const names = data.已排除.map((item) => item.小区 + "（" + item.排除 + "）").join("、");
        foot.append(el("p", null, "已排除、不在上面的卡片里：" + names + "。"));
      }
      foot.append(el("p", null, data.免责声明 || ""));
    }

    fetch(new URL("data.json", document.baseURI))
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then(render)
      .catch(() => {
        const disclaimer = document.getElementById("disclaimer");
        disclaimer.textContent = "套数没有读到。请确认同目录有 data.json。";
      });
  </script>
</body>
</html>
